<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>FitTrack Dashboard</title>
<style>
body { font-family: Arial,sans-serif; background:#f5f5f5; }
.container { max-width:800px; margin:2rem auto; background:#fff; padding:2rem; border-radius:10px; box-shadow:0 5px 20px rgba(0,0,0,0.1);}
h2 { text-align:center; margin-bottom:1.5rem; }
table { width:100%; border-collapse:collapse; }
th, td { border:1px solid #ddd; padding:0.5rem; text-align:center; }
th { background:#3A8DFF; color:#fff; }
</style>
</head>
<body>
<div class="container">
<h2>Weight Progress</h2>
<table>
<tr><th>Date</th><th>Weight (kg)</th></tr>
{% for w in weights %}
<tr>
<td>{{ w.date.strftime("%Y-%m-%d") }}</td>
<td>{{ w.weight }}</td>
</tr>
{% endfor %}
</table>
<a href="{{ url_for('logout') }}">Logout</a>
</div>
</body>
</html>
